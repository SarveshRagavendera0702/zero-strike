name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Set up signing key, editor settings, SDK paths
        shell: bash
        run: |
          set -euo pipefail
          JDK_DIR=$(dirname "$(dirname "$(readlink -f "$(command -v keytool)")")")
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          KEY="$HOME/keys/debug.keystore"
          mkdir -p "$HOME/keys"
          keytool -genkeypair -keystore "$KEY" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Godot 4.3 reads Android export settings from its editor settings file.
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" << TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JDK_DIR"
          export/android/android_sdk_path = "$SDK_DIR"
          export/android/debug_keystore = "$KEY"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          TRES

          {
            echo "GODOT_JAVA_SDK_PATH=$JDK_DIR"
            echo "GODOT_ANDROID_SDK_PATH=$SDK_DIR"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEY"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

          echo "Godot: $(godot --version || echo 'NOT FOUND')"
          echo "JDK: $JDK_DIR"
          echo "Android SDK: $SDK_DIR"
          ls "$SDK_DIR" || echo "WARNING: Android SDK folder not found"

      - name: Install Android build tools if missing
        shell: bash
        run: |
          set -uo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          if [ ! -d "$SDK_DIR/build-tools" ] || [ -z "$(ls -A "$SDK_DIR/build-tools" 2>/dev/null)" ]; then
            if command -v sdkmanager >/dev/null 2>&1; then
              yes | sdkmanager --licenses >/dev/null 2>&1 || true
              sdkmanager "platforms;android-34" "build-tools;34.0.0"
            else
              echo "ERROR: no build-tools found and sdkmanager is unavailable"
              exit 1
            fi
          fi
          ls "$SDK_DIR/build-tools"

      - name: Install Godot 4.3 export templates if missing
        shell: bash
        run: |
          set -euo pipefail
          TPL_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          if [ -f "$TPL_DIR/android_debug.apk" ] && [ -f "$TPL_DIR/android_release.apk" ]; then
            echo "Export templates already present."
            exit 0
          fi
          URL="https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          curl -fL -o /tmp/templates.tpz "$URL"
          rm -rf /tmp/tpz && mkdir -p /tmp/tpz
          unzip -q /tmp/templates.tpz -d /tmp/tpz
          mkdir -p "$TPL_DIR"
          cp -r /tmp/tpz/templates/. "$TPL_DIR/"
          echo "4.3.stable" > "$TPL_DIR/version.txt"
          ls "$TPL_DIR" | head -50

      - name: Import project assets
        shell: bash
        run: godot --headless --import || true

      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --export-debug "Android" build/ZeroStrike-debug.apk
          test -s build/ZeroStrike-debug.apk
          unzip -t build/ZeroStrike-debug.apk | tail -1
          ls -la build

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeroStrike-debug-apk
          path: build/ZeroStrike-debug.apk
          if-no-files-found: error

      - name: Publish downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zero Strike build ${{ github.run_number }}
          files: build/ZeroStrike-debug.apk
          make_latest: true
